<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const categories = ["Tất cả", ...new Set(MSC_POSTS.map(p => p.category))];
  const filterRow = document.getElementById("filter-row");
  const grid = document.getElementById("post-grid");
  const empty = document.getElementById("empty-state");

  function render(activeCat) {
    const sorted = [...MSC_POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
    const list = activeCat === "Tất cả" ? sorted : sorted.filter(p => p.category === activeCat);
    grid.innerHTML = list.map(p => mscPostCardHTML(p)).join("");
    empty.style.display = list.length ? "none" : "block";
  }

  filterRow.innerHTML = categories.map((c, i) =>
    `<button class="filter-chip${i === 0 ? " is-active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");

  filterRow.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-chip");
    if (!btn) return;
    filterRow.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    render(btn.dataset.cat);
  });

  render("Tất cả");
</script>
