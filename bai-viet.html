<!DOCTYPE html>

</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">MSC <span>Capital</span></span>
      <span class="brand-tagline">Tư vấn đầu tư chứng khoán</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-label="Mở menu">Menu</button>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="blog.html" aria-current="page">Blog</a>
      <a href="uu-dai.html">Ưu đãi</a>
      <a href="index.html#gioi-thieu">Về MSC</a>
      <a class="nav-cta" href="index.html#lien-he">Đăng ký tư vấn</a>
    </nav>
  </div>
</header>

<div class="ticker-bar">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "HOSE:VNINDEX", "description": "VN-Index" },
        { "proName": "HOSE:VN30", "description": "VN30" },
        { "proName": "HNX:HNXINDEX", "description": "HNX-Index" },
        { "proName": "HNX:300", "description": "HNX30" },
        { "proName": "HNX:301", "description": "UPCOM" }
      ],
      "showSymbolLogo": false,
      "isTransparent": true,
      "displayMode": "compact",
      "colorTheme": "dark",
      "locale": "vi_VN"
    }
    </script>
  </div>
</div>


<article>
  <div class="wrap article-head">
    <div class="breadcrumb"><a href="blog.html">Blog</a> / <span id="crumb-cat">—</span></div>
    <h1 id="article-title">Đang tải bài viết…</h1>
    <div class="article-meta">
      <span id="article-author"></span>
      <span id="article-date"></span>
    </div>
  </div>

  <div class="wrap">
    <div class="article-body" id="article-body"></div>
  </div>
</article>

<section class="section" style="padding-top:24px;">
  <div class="wrap">
    <div class="section-head">
      <h2>Bài viết liên quan</h2>
      <a class="see-all" href="blog.html">Xem tất cả →</a>
    </div>
    <div class="post-grid related-posts" id="related-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-legal">
      <span>© 2026 MSC Capital. Nội dung mang tính chất chia sẻ thông tin, không phải khuyến nghị đầu tư.</span>
      <a href="index.html">Về trang chủ</a>
      <span><a href="tel:0329483603">0329.483.603</a> · <a href="mailto:msccapitall@gmail.com">msccapitall@gmail.com</a></span>
    </div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const post = MSC_POSTS.find(p => p.slug === slug);
  const body = document.getElementById("article-body");

  if (!post) {
    document.getElementById("article-title").textContent = "Không tìm thấy bài viết";
    body.innerHTML = `<p>Bài viết này không tồn tại hoặc đường dẫn không đúng. <a href="blog.html">Quay lại danh sách bài viết →</a></p>`;
  } else {
    document.getElementById("page-title").textContent = post.title + " — MSC Capital";
    document.getElementById("crumb-cat").textContent = post.category;
    document.getElementById("article-title").textContent = post.title;
    document.getElementById("article-author").textContent = post.author;
    document.getElementById("article-date").textContent = mscFormatDate(post.date);

    let html = "";
    if (post.youtubeId) {
      html += `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${post.youtubeId}" title="${post.title}" allowfullscreen loading="lazy"></iframe></div>`;
    }
    html += post.content.map(p => `<p>${p}</p>`).join("");
    html += `<div class="disclaimer-box">Nội dung trên mang tính chất chia sẻ thông tin và kiến thức đầu tư, không phải khuyến nghị mua/bán một mã cổ phiếu cụ thể. Nhà đầu tư tự chịu trách nhiệm với quyết định của mình.</div>`;
    body.innerHTML = html;

    const related = MSC_POSTS.filter(p => p.slug !== post.slug && p.category === post.category).slice(0, 3);
    const fallback = related.length ? related : MSC_POSTS.filter(p => p.slug !== post.slug).slice(0, 3);
    document.getElementById("related-grid").innerHTML = fallback.map(p => mscPostCardHTML(p)).join("");
  }
</script>
</body>
</html>
